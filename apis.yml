aid: noredink
name: NoRedInk
description: >-
  NoRedInk is a K-12 English Language Arts platform used by millions of students
  and teachers to build stronger writers and critical thinkers. It combines
  adaptive grammar and writing practice, personalized high-interest content,
  authentic assessments, guided essays with self and peer review, actionable
  teacher data, and an AI-powered Grading Assistant. NoRedInk's public developer
  surface is a standards-based OAuth 2.0 / OpenID Connect authorization server
  (issuer https://www.noredink.com) that powers single sign-on and classroom
  rostering integrations with Clever, ClassLink, Canvas, and Google Classroom.
