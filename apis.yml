  description: >-
    NoRedInk's OAuth 2.0 authorization server with OpenID Connect on top, used
    for single sign-on and partner/classroom-rostering integrations. Advertises
    the authorization-code + refresh-token grants, an `openid` scope, RS256 id
    tokens, and userinfo/JWKS/introspection/revocation endpoints under /oauth/*.
